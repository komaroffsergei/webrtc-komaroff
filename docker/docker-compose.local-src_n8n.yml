services:
  # Используйте этот override, если запускаете `src_n8n` локально (IDE), а n8n остаётся в Docker.
  # Он переключает tool proxy URL на хост-машину.
  n8n:
    environment:
      TOOL_PROXY_URL: http://host.docker.internal:9000/tool

  n8n_webhook:
    environment:
      TOOL_PROXY_URL: http://host.docker.internal:9000/tool

  n8n_worker:
    environment:
      TOOL_PROXY_URL: http://host.docker.internal:9000/tool

