      PYCHARM_PROJECT_ROOT: ${PYCHARM_PROJECT_ROOT:-}
      PYCHARM_SOURCE_SUBDIR: src_core
      PYCHARM_REMOTE_ROOT: /app/src_core
      PYCHARM_REMOTE_SHARED_ROOT: /app/src_shared
      DEBUGPY_WAIT_FOR_CLIENT: ${DEBUGPY_WAIT_FOR_CLIENT:-0}
      CORE_DEBUG_PORT: ${CORE_DEBUG_PORT:-5671}
    volumes:
