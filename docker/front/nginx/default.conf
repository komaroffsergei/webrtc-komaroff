server {
    listen 8000;

    sendfile on;

    default_type application/octet-stream;

    root /usr/share/nginx/html;

    gzip_static       on;

    # --- Backend routing (same-origin for the web app) ---
    location /core {
        proxy_pass http://src_core:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://src_api_gateway:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NATS WebSocket proxy for the browser client (matches stack ingress `/ws`).
    location /ws {
        proxy_pass http://nats:9222;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}
