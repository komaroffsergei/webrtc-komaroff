#    build:
#      context: ../src_whisper
#      dockerfile: ../docker/whisper/Dockerfile
#    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/whisper/${CI_COMMIT_BRANCH}
#    ports:
#      - "8090:8090"
#    depends_on:
#      - nats
#    environment:
#      WEBUI_ENABLED: 1
#      WEBUI_HOST: 0.0.0.0
#      WEBUI_PORT: 8090
#      WEBUI_BASE_PATH: ""

  src_llm:
    build:
      context: ../src_llm
      dockerfile: ../docker/llm/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/llm/${CI_COMMIT_BRANCH}
    depends_on:
      - nats
    environment:
      NATS_URL: nats://nats:4222

  src_front:
    build:
      context: ../src_front
      additional_contexts:
        nginx: ../docker/front/nginx
      dockerfile: ../docker/front/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/front/${CI_COMMIT_BRANCH}
    ports:
      - "8080:8000"
    depends_on:
      - src_core
      - nats

  nats:
    image: nats:2.11
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"  # NATS TCP
      - "9222:9222"  # NATS WebSocket
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro

volumes:
  src_postgres_data:
    name: src_postgres_data