name: webrtc-komaroff-dev

services:
  src_postgres:
    build:
      context: ../src_postgres
      additional_contexts:
        postgres: ../docker/postgres
      dockerfile: ../docker/postgres/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/postgres/${CI_COMMIT_BRANCH}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcp}
      POSTGRES_USER: ${POSTGRES_USER:-mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_pass}
    volumes:
      - src_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp} -d ${POSTGRES_DB:-mcp}"]
      interval: 3s
      timeout: 3s
      retries: 20

  src_api_gateway:
    build:
      context: ../src_api_gateway
      additional_contexts:
        shared: ../src_shared
      dockerfile: ../docker/api/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/api-gateway/${CI_COMMIT_BRANCH}
    ports:
      - "127.0.0.1:8101:8100"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8100
      NATS_URL: ${NATS_URL_INTERNAL:-nats://nats:4222}
      NATS_TOOLS_PREFIX: nats.tools.
    depends_on:
      - nats

  src_core:
    build:
      context: ../src_core
      additional_contexts:
        shared: ../src_shared
      dockerfile: ../docker/core/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/core/${CI_COMMIT_BRANCH}
    ports:
      - "8000:8000"
    depends_on:
      - nats
      - src_api_gateway
    environment:
      API_URL: http://src_api_gateway:8100/api
      NATS_URL: ${NATS_URL_INTERNAL:-nats://nats:4222}
      NATS_AGENT_HISTORY_SUBJECT: nats.agent.history.

  src_agent:
    build:
      context: ../src_agent
      additional_contexts:
        shared: ../src_shared
      dockerfile: ../docker/agent/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/agent/${CI_COMMIT_BRANCH}
    depends_on:
      nats:
        condition: service_started
      src_api_gateway:
        condition: service_started
      src_postgres:
        condition: service_healthy
    environment:
      NATS_URL: ${NATS_URL_INTERNAL:-nats://nats:4222}
      NATS_WORKFLOW_RUN_SUBJECT: ${NATS_WORKFLOW_RUN_SUBJECT:-nats.workflow.run}
      NATS_AGENT_HISTORY_SUBJECT: nats.agent.history.
      DATABASE_URL: postgresql://mcp:mcp_pass@src_postgres:5432/mcp

  src_llm:
    build:
      context: ../src_llm
      additional_contexts:
        shared: ../src_shared
      dockerfile: ../docker/llm/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/llm/${CI_COMMIT_BRANCH}
    depends_on:
      - nats
    environment:
      NATS_URL: ${NATS_URL_INTERNAL:-nats://nats:4222}
      USER_ID: ${USER_ID:-user123}
      LLM_MODE: remote
      OLLAMA_URL: http://ollama.h100.local

  src_langgraph:
    profiles: ["langgraph"]
    build:
      context: ../src_langgraph
      additional_contexts:
        shared: ../src_shared
      dockerfile: ../docker/langgraph/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/langgraph/${CI_COMMIT_BRANCH}
    depends_on:
      - nats
      - src_llm
      - src_api_gateway
    environment:
      NATS_URL: ${NATS_URL_INTERNAL:-nats://nats:4222}
      USER_ID: ${USER_ID:-user123}
      NATS_WORKFLOW_RUN_SUBJECT: nats.workflow.run
      NATS_WORKFLOW_HEALTH_SUBJECT: nats.workflow.health
      NATS_LLM_SUBJECT: nats.llm.
      NATS_TOOLS_PREFIX: nats.tools.
      NATS_REQUEST_TIMEOUT_SECONDS: 120
      MAX_CONCURRENCY: 8
      MEMORY_RECENT_MESSAGES: 16
      MEMORY_SUMMARY_MAX_CHARS: 4000
      MEMORY_CONTEXT_MAX_CHARS: 5000

  src_front:
    build:
      context: ../src_front
      additional_contexts:
        nginx: ../docker/front/nginx
      dockerfile: ../docker/front/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/front/${CI_COMMIT_BRANCH}
    ports:
      - "8080:8000"
    environment:
      FRONT_NATS_WS_UPSTREAM: ${FRONT_NATS_WS_UPSTREAM:-nats}
    depends_on:
      - src_core
      - nats

  src_e2e:
    profiles: ["test"]
    build:
      context: ../src_e2e
      additional_contexts:
        shared: ../src_shared
      dockerfile: ../docker/e2e/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/e2e/${CI_COMMIT_BRANCH}
    depends_on:
      - nats
      - src_postgres
      - src_api_gateway
      - src_llm
      - src_agent
    environment:
      USER_ID: ${USER_ID:-user123}
      NATS_URL: ${NATS_URL_INTERNAL:-nats://nats:4222}
      DATABASE_URL: postgresql://mcp:mcp_pass@src_postgres:5432/mcp
      NATS_AGENT_SUBJECT: nats.agent.
      NATS_WORKFLOW_HEALTH_SUBJECT: nats.workflow.health
    restart: "no"

  nats:
    image: nats:2.11
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "14222:4222"
      - "9222:9222"
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro

volumes:
  src_postgres_data:
    name: src_postgres_data
