services:
  webrtc-server-back:
    image: ${REGISTRY_HOST}/webrtc-server-komaroff-back/${CI_COMMIT_BRANCH}
    build:
      context: ../src_back
      dockerfile: ../docker/python/Dockerfile
      target: base
    ports:
      - "8000:8000"
    volumes:
      - silero_vad_cache:/opt/silero_vad
#    environment:
#      - NATS_URL=${NATS_URL}
    depends_on:
      - audio_nats

  audio_nats:
    image: nats:2.11.6-scratch
    command: ["-js"]


  webrtc-server-whisper:
    image: ${REGISTRY_HOST}/webrtc-server-komaroff-whisper/${CI_COMMIT_BRANCH}
    build:
      context: ../src_whisper
      #      additional_contexts:
      #        docker: ../docker
      dockerfile: ../docker/python/Dockerfile
      target: whisper
    depends_on:
      - audio_nats
    ports:
      - "9000:9000"

volumes:
  silero_vad_cache:
