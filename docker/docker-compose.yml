services:
  src_frontend:
    build:
      context: ./src_front
    ports:
      - "8080:80"
    environment:
      - VITE_NATS_URL=ws://localhost:9222
      - VITE_NATS_EVENTS_SUBJECT=nats.events.user123
      - VITE_NATS_AGENT_SUBJECT=nats.agent.user123
    depends_on:
      - nats

  api_gateway:
    build:
      context: ./src_api_gateway
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    environment:
      - API_PORT=8100

  src_core:
    build:
      context: ./src_core
      dockerfile: ./docker/python/Dockerfile
    environment:
      - USER_ID=user123
      - NATS_URL=nats://nats:4222
      - NATS_AGENT_SUBJECT=nats.agent.
      - NATS_ASR_SUBJECT=nats.asr.
      - NATS_EVENTS_SUBJECT=nats.events.
      - CORE_PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - nats
      - api_gateway

  src_agent:
    build:
      context: ./src_agent
      dockerfile: Dockerfile
    environment:
      - USER_ID=user123
      - NATS_URL=nats://nats:4222
      - NATS_AGENT_SUBJECT=nats.agent.
      - NATS_LLM_SUBJECT=nats.llm.
      - NATS_EVENTS_SUBJECT=nats.events.
      - AGENT_MAX_STEPS=10
      - AIRPORTS_API_URL=http://api_gateway:8100/api/airports/search
      - RUNWAYS_API_URL=http://api_gateway:8100/api/airports
      - PILOT_API_URL=http://api_gateway:8100/api/pilot/location
      - ROUTES_API_URL=http://api_gateway:8100/api/routes/nearest
      - WEATHER_API_URL=http://api_gateway:8100/api/weather
    depends_on:
      - nats
      - api_gateway
      - src_postgres

  src_llm:
    build:
      context: ./src_llm
      dockerfile: Dockerfile
    environment:
      - USER_ID=user123
      - NATS_URL=nats://nats:4222
      - NATS_LLM_SUBJECT=nats.llm.
      - NATS_EVENTS_SUBJECT=nats.events.
      - OLLAMA_URL=http://host.docker.internal:11435
      - TOOLS_MANIFEST=/app/manifest.json
    volumes:
      - ./src_agent/manifest.json:/app/manifest.json:ro
    depends_on:
      - nats

  src_whisper:
    build:
      context: ./src_whisper
      dockerfile: Dockerfile
    environment:
      - USER_ID=user123
      - NATS_URL=nats://nats:4222
      - NATS_ASR_SUBJECT=nats.asr.
      - NATS_EVENTS_SUBJECT=nats.events.
      - ASR_MODEL_ID=Systran/faster-whisper-small
    depends_on:
      - nats


  # docker exec -i src_postgres psql -U mcp -d mcp < src_postgres/data/init/010_core_schema.sql
  src_postgres:
    image: postgres:16-alpine
    container_name: src_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: mcp_pass
    ports:
      - "5432:5432"
    volumes:
      - mcp_pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 3s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"  # NATS TCP
      - "9222:9222"  # NATS WebSocket
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro


volumes:
  mcp_pg_data:
    name: mcp_pg_data