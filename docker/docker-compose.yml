services:
  src_postgres:
    build:
      context: ../src_postgres
      dockerfile: Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/postgres/${CI_COMMIT_BRANCH}
    ports:
      - "5432:5432"
    volumes:
      - src_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcp} -d ${POSTGRES_DB:-mcp}"]
      interval: 3s
      timeout: 3s
      retries: 20

  src_api_gateway:
    build:
      context: ../src_api_gateway
      dockerfile: ../docker/api/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/api-gateway/${CI_COMMIT_BRANCH}
    ports:
      - "8100:8100"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8100

  src_core:
    build:
      context: ../src_core
      dockerfile: ../docker/core/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/core/${CI_COMMIT_BRANCH}
    ports:
      - "8000:8000"
    depends_on:
      - nats
      - src_api_gateway

  src_agent:
    build:
      context: ../src_agent
      dockerfile: Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/agent/${CI_COMMIT_BRANCH}
    depends_on:
      - nats
      - src_api_gateway
      - src_postgres

  src_whisper:
    build:
      context: ../src_whisper
      dockerfile: Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/whisper/${CI_COMMIT_BRANCH}
    depends_on:
      - nats

  src_front:
    build:
      context: ../src_front
      additional_contexts:
        nginx: ../docker/front/nginx
      dockerfile: ../docker/front/Dockerfile
    image: ${REGISTRY_HOST}/gis/webrtc-komaroff/front/${CI_COMMIT_BRANCH}
    ports:
      - "8080:8000"
    depends_on:
      - src_core
      - nats

  nats:
    image: nats:2.11
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"  # NATS TCP
      - "9222:9222"  # NATS WebSocket
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro

volumes:
  src_postgres_data:
    name: src_postgres_data
