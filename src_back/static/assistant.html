<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Voice assistant</title>
    <link href="/static/assistant.css" type="text/css" rel="stylesheet">
</head>
<body>
<div class="assistant-container" id="assistantContainer">
    <div class="header">
        <h1>Voice assistant</h1>
    </div>

    <div class="chat-window">
        <canvas id="waveBackground" class="waveform-background"></canvas>
        <div class="message-log" id="messageLog">
            <div class="message server-message">
                Готов к работе. Нажмите микрофон для начала разговора.
            </div>
        </div>

        <div class="text-input-container">
            <input type="text" class="text-input" id="textInput" placeholder="Введите сообщение...">
        </div>
    </div>

    <div class="connection-status" id="connectionStatus">
        Не подключено
    </div>

    <div class="mic-button-container">
        <button id="micButton" class="mic-button">
            <svg class="mic-icon" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
            <canvas id="micWaveform" class="mic-waveform"></canvas>
        </button>
    </div>
</div>

<audio id="remoteAudio" autoplay class="hidden"></audio>

<script src="/static/config.js"></script>
<script src="/static/audio_viz.js"></script>
<script src="/static/vad.js"></script>
<script src="/static/webrtc.js"></script>
<script src="/static/command_handler.js"></script>
<script src="/static/chat_ui.js"></script>
<script src="/static/warning_ui.js"></script>
<script src="/static/assistant.js"></script>
</body>
</html>
