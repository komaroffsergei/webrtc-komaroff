<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <title>Voice Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script>
        window.SETTINGS = window.SETTINGS || {};
    </script>
</head>
<body>
<div id="mapRoot"></div>
<div class="audio-controls">
    <div class="control-group">
        <label class="control-label">
            <input type="checkbox" id="vadEnable"/>
            Mic level meter
        </label>
        <label class="control-label">
            <span>Уровень:</span>
            <span id="vadLevel" class="control-value">-inf dBFS</span>
        </label>
    </div>
    <div class="control-group">
        <label class="control-label">
            <input type="checkbox" id="ecEnable" checked/>
            echoCancellation
        </label>
        <label class="control-label">
            <input type="checkbox" id="nsEnable" checked/>
            noiseSuppression
        </label>
    </div>
</div>
<div class="assistant-container" id="assistantContainer">


    <div class="assistant-box">
        <div class="header">
            <h1>Voice assistant</h1>
        </div>

        <div class="chat-window">
            <canvas id="waveBackground" class="waveform-background"></canvas>
            <div class="message-log" id="messageLog"></div>

            <div class="text-input-container">
                <input
                        type="text"
                        class="text-input"
                        id="textInput"
                        placeholder="Введите сообщение..."
                />
            </div>
        </div>

        <div class="connection-status" id="connectionStatus">
            Не подключено
        </div>

        <div class="model-status" id="modelStatus"></div>

        <div class="mic-button-container">
            <button id="micButton" class="mic-button" type="button">
                <svg class="mic-icon" viewBox="0 0 24 24">
                    <path
                            d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"
                    />
                    <path
                            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
                    />
                </svg>
                <canvas id="micWaveform" class="mic-waveform"></canvas>
            </button>
        </div>
    </div>
</div>

<audio id="remoteAudio" autoplay class="hidden"></audio>

<div id="debugPanelRoot"></div>
<div id="warningContainer"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
